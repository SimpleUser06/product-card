<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Async Users</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page">
    <h1 class="title">Пользователи</h1>

    <div class="controls">
      <button id="showAllBtn" class="btn">Получить все карточки</button>
      <button id="deleteAllBtn" class="btn btn-danger">Удалить все карточки</button>
    </div>

    <p id="message" class="message">Данные загружаются</p>

    <div id="usersContainer" class="users-container"></div>
  </div>

  <template id="user-template">
    <div class="user-card">
      <p><strong>ID:</strong> <span class="user-id"></span></p>
      <p><strong>Имя:</strong> <span class="user-name"></span></p>
      <p><strong>Фамилия:</strong> <span class="user-surname"></span></p>
      <p><strong>Email:</strong> <span class="user-email"></span></p>
      <p><strong>Возраст:</strong> <span class="user-age"></span></p>
      <button class="btn btn-delete">Удалить карточку</button>
    </div>
  </template>

  <script type="module" src="./async.js"></script>
</body>
</html>
